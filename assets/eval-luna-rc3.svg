<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">SolidJS 2.0 rc.3 skill exam pass rates</title>
  <desc id="desc">Luna Low scored 5 percent without the skill, 45 percent with routed content, and 60 percent with deployed skill retrieval. Terra Medium graded 58 questions once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="content" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="deployed" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="390" rx="22" fill="url(#bg)"/>
  <text x="42" y="47" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">SolidJS 2.0 rc.3 skill exam</text>
  <text x="42" y="73" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Luna · reasoning low · 58 questions · N=1 · judged by Terra medium</text>

  <g stroke="#30363d" stroke-width="1">
    <line x1="70" y1="300" x2="840" y2="300"/>
    <line x1="70" y1="250" x2="840" y2="250" stroke-dasharray="4 6"/>
    <line x1="70" y1="200" x2="840" y2="200" stroke-dasharray="4 6"/>
    <line x1="70" y1="150" x2="840" y2="150" stroke-dasharray="4 6"/>
    <line x1="70" y1="100" x2="840" y2="100" stroke-dasharray="4 6"/>
  </g>
  <g fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" text-anchor="end">
    <text x="60" y="304">0</text><text x="60" y="254">25</text><text x="60" y="204">50</text><text x="60" y="154">75</text><text x="60" y="104">100</text>
  </g>

  <rect x="135" y="290" width="150" height="10" rx="5" fill="#6e7681"/>
  <rect x="375" y="210" width="150" height="90" rx="9" fill="url(#content)"/>
  <rect x="615" y="180" width="150" height="120" rx="9" fill="url(#deployed)" filter="url(#glow)"/>

  <g fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="210" y="278">5%</text>
    <text x="450" y="198">45%</text>
    <text x="690" y="168">60%</text>
  </g>
  <g fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <text x="210" y="329">base</text>
    <text x="450" y="329">content</text>
    <text x="690" y="329">deployed</text>
  </g>
  <g fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" text-anchor="middle">
    <text x="210" y="349">3 / 58</text>
    <text x="450" y="349">26 / 58</text>
    <text x="690" y="349">35 / 58</text>
  </g>

  <rect x="740" y="27" width="118" height="30" rx="15" fill="#16351f" stroke="#2ea043"/>
  <text x="799" y="47" fill="#7ee787" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700" text-anchor="middle">retrieval 100%</text>
</svg>
